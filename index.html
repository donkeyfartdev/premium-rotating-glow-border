<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Rotating Glow Border</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 20px;
    }

    .glow-card {
      position: relative;
      border-radius: 24px;
      padding: 3px;
      background: #0a0a0a;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 0 30px rgba(0, 245, 255, 0.2),
        0 0 60px rgba(168, 85, 247, 0.15),
        0 0 100px rgba(244, 114, 182, 0.1);
    }

    .glow-card::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        #00f5ff 12%,
        #a855f7 28%,
        #f472b6 42%,
        #fbbf24 58%,
        #22d3ee 72%,
        #00f5ff 88%,
        transparent 100%
      );
      border-radius: inherit;
      animation: rotate 4s linear infinite;
      z-index: -1;
      filter: blur(2px);
    }

    .glow-card::after {
      content: "";
      position: absolute;
      inset: 3px;
      background: #0a0a0a;
      border-radius: 21px;
      z-index: -1;
    }

    .glow-card-inner {
      position: relative;
      background: linear-gradient(145deg, #141414, #0a0a0a);
      border-radius: 21px;
      padding: 40px 32px;
      color: white;
      text-align: center;
      z-index: 1;
    }

    .glow-card-inner h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #00f5ff, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glow-card-inner p {
      color: #a1a1aa;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(0, 245, 255, 0.1);
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: #00f5ff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="glow-card">
    <div class="glow-card-inner">
      <div class="badge">PREMIUM</div>
      <h2 style="margin-top: 16px;">Rotating Glow</h2>
      <p>A clean, high-end rotating border effect built with pure CSS. Perfect for cards, buttons, and premium UI elements.</p>
      <div class="badge">CSS ONLY</div>
    </div>
  </div>
</body>
</html>
